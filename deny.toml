# Contrôle des licences des dépendances Rust (SPEC 8.3, N-11 : le projet est sous
# GPL-3.0 ou ultérieure ; chaque dépendance doit être compatible avec elle).
#   cargo deny check licenses
#   cargo deny --manifest-path apps/desktop/Cargo.toml --config deny.toml check licenses
# Toutes les cibles sont contrôlées (Windows, Linux, Android). Une licence absente de la
# liste fait échouer le contrôle : l'ajouter seulement après avoir vérifié sa
# compatibilité avec la GPL-3.0, et le noter dans la SPEC (8.3).

[graph]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    # Permissives, compatibles avec la GPL-3.0.
    "MIT",
    "MIT-0",
    "0BSD", # application de bureau seulement (adler2) : avertissement attendu ailleurs
    "ISC",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    # Boost Software License 1.0, permissive (FSF : compatible avec la GPL) : arboard et
    # clipboard-win, presse-papiers du bureau (F-30, 2026-11-11).
    "BSL-1.0",
    # Compatible avec la GPL-3.0 (pas avec la GPL-2.0 seule).
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    # Copyleft faible par fichier, compatible avec la GPL-3.0 (section 3 de la MPL-2.0).
    "MPL-2.0",
    # Licence de données permissive (attribution seule) : les certificats racines de
    # Mozilla, dans webpki-root-certs.
    "CDLA-Permissive-2.0",
]

# Nos propres paquets (publish = false) : GPL-3.0-or-later, non contrôlés.
[licenses.private]
ignore = true
