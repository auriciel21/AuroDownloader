[package]
name = "auro-desktop"
description = "Application de bureau d'AuroDownloader (SPEC §4.3, F-36)"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.88"
publish = false

# Hors de l'espace de travail du moteur : Tauri demande WebKitGTK 4.1 sous Linux et de
# longues compilations, que ni `cargo test --workspace` ni la CI du moteur ne doivent payer.
[workspace]

[[bin]]
name = "aurodownloader"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
auro-engine = { path = "../../crates/engine" }
# Fichiers .torrent lus pour le moteur (`task.add`, SPEC §6.5).
base64 = "0.22.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Presse-papiers (F-30, étape 2c) : texte seul, sans images.
arboard = { version = "3", default-features = false }
# Langue du système, pour le menu de l'icône avant que la page ne soit chargée.
sys-locale = "0.3"
# QR code de l'accès à distance (étape 3d) : la matrice seule, dessinée par la page.
qrcode = { version = "0.14", default-features = false }
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1.54.1", features = ["io-util", "macros", "rt", "sync", "time"] }
tauri-plugin-updater = "2"

# Association aux liens magnet et aux .torrent (clés de l'utilisateur), étape 5b.
[target.'cfg(windows)'.dependencies]
winreg = "0.56"
# Notification d'un lien copié, avec le clic (F-30) : le greffon de Tauri ne le transmet pas.
tauri-winrt-notification = "0.8"

# Présence d'une zone de notification (`org.kde.StatusNotifierWatcher` sur le bus de session).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
# Notification d'un lien copié, avec son action (F-30).
notify-rust = { version = "4", default-features = false, features = ["z"] }

[dev-dependencies]
auro-engine = { path = "../../crates/engine", features = ["testing"] }
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = true
strip = true

# Mêmes copies corrigées que l'espace de travail principal (third_party/README.md).
[patch.crates-io]
librqbit = { path = "../../third_party/librqbit" }
librqbit-dualstack-sockets = { path = "../../third_party/librqbit-dualstack-sockets" }
