[package]
name = "proto"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
suppaftp = { version = "13.0.0", features = ["tokio-rustls-aws-lc-rs", "deprecated"] }
russh = "0.65.2"
russh-sftp = "3.0.1"
tokio = { version = "1", features = ["full"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
rustls-platform-verifier = "0.6"
sha2 = "0.10"
url = "2"
anyhow = "1"
libunftp = { version = "0.25.0", default-features = false, features = ["aws_lc_rs"] }
unftp-sbe-fs = "0.4.1"
