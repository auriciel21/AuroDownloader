[package]
name = "auro-torrent-rqbit"
version = "0.1.0"
description = "Prototype torrent avec librqbit (experiments/torrent/README.md)"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

# Hors de l'espace de travail du projet.
[workspace]

[dependencies]
librqbit = { version = "=9.1.0", default-features = false, features = ["rust-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
anyhow = "1"

[profile.release]
debug = false
