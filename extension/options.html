<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="name">AuroDownloader</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1 data-i18n="optionsTitle">AuroDownloader</h1>
    <form id="form">
      <label class="check"><input type="checkbox" id="capture"> <span data-i18n="optCapture"></span></label>
      <label class="field"><span data-i18n="optMinSize"></span>
        <span class="row"><input type="number" id="minSizeMiB" min="0" step="0.5"> <span data-i18n="unitMiB"></span></span></label>
      <label class="field"><span data-i18n="optExcluded"></span>
        <textarea id="excludedSites" rows="4" spellcheck="false" data-i18n-placeholder="optExcludedHint"></textarea></label>
      <label class="check"><input type="checkbox" id="captureIncognito"> <span data-i18n="optIncognito"></span></label>
      <p class="hint" data-i18n="optAltHint"></p>
      <p class="status" id="saved" role="status"></p>
    </form>
    <section>
      <h2 data-i18n="linkTitle"></h2>
      <p><button type="button" id="check" data-i18n="linkCheck"></button> <span id="link" role="status"></span></p>
      <p class="hint" id="last"></p>
    </section>
  </main>
  <script src="decide.js"></script>
  <script src="options.js"></script>
</body>
</html>
