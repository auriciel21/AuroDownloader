name: CI

# Intégration continue (SPEC 4.6 et 9.1, phase 7, étape 8 ; décisions du 2026-11-18) : tout
# tourne à chaque envoi sur main et à chaque pull request, ARM64 et émulateur Android
# compris. Actions épinglées par SHA, mises à jour par Dependabot ; aucun job ne garde le
# jeton de git (audit W4, W17).
on:
  push:
    branches: [main]
  pull_request:
  # Banc de performance (SPEC §9.1, N-01) : à la demande, et chaque lundi.
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Le moteur, la CLI et le banc de reprise court (cargo test) ; ARM64 sur les machines ARM
  # natives de GitHub, sans essai sur du matériel réel.
  engine:
    name: moteur (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, ubuntu-24.04-arm, windows-11-arm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # branche stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # L'application de bureau (Tauri 2), espace de travail à part.
  desktop:
    name: bureau (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, ubuntu-24.04-arm, windows-11-arm]
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # branche stable
        with:
          components: rustfmt, clippy
      - name: Bibliothèques de Tauri (WebKitGTK 4.1)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev pkg-config build-essential
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop -> target
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # La page (ui) et l'extension : tests node, axe-core et jsdom (dépendances de développement).
  web:
    name: page et extension
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: ui
      - run: node --check ui/src/main.js
      - run: node --test ui/tests/ extension/tests/
      # Scripts de publication (latest.json, étape 8c) et de version.
      - run: node --test scripts/tests/
      - name: Versions accordées (scripts/version.sh)
        run: |
          sh scripts/version.sh --check "$(sed -n 's/^  "version": "\(.*\)",$/\1/p' apps/desktop/tauri.conf.json)"

  # Licences des dépendances (N-11, SPEC 8.3), les deux espaces de travail Cargo.
  licenses:
    name: licences
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny
      # Les commandes de CLAUDE.md, telles quelles.
      - run: cargo deny check licenses
      - run: cargo deny --manifest-path apps/desktop/Cargo.toml --config deny.toml check licenses

  # Android : l'application construite, et ses tests instrumentés (accessibilité, étape 7c)
  # sur l'émulateur x86_64, avec le moteur compilé pour x86_64 (`auroAbis`).
  android:
    name: Android (émulateur)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # branche stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - name: NDK du projet
        run: echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
      - name: Construction (arm64 des appareils, x86_64 de l'émulateur)
        working-directory: apps/android
        run: ./gradlew assembleDebug assembleDebugAndroidTest -PauroAbis=arm64-v8a,x86_64
      - name: Accélération de l'émulateur (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Tests instrumentés
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: sh apps/android/ci-instrument.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: android-instrument
          path: apps/android/app/build/instrument.txt
          if-no-files-found: ignore

  # La porte de performance se mesure sous Linux, sans antivirus (SPEC §9.1) : à nombre de
  # connexions égal, débit au moins 0,95 fois et coût processeur par octet au plus 1,0
  # fois ceux d'aria2. Le tableau va dans le résumé de l'exécution.
  perf:
    name: performance (Linux)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # branche stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get update && sudo apt-get install -y aria2 curl
      - name: Banc face à aria2
        env:
          AURO_ARIA2: aria2c
          AURO_PERF_SIZE: "536870912"
          AURO_PERF_RUNS: "5"
          AURO_PERF_ENFORCE: "1"
        run: |
          set -o pipefail
          { echo "Machine : $(nproc) processeurs, $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2)"; \
            aria2c --version | head -1; } | tee perf.txt
          cargo test --release -p auro-cli --test perf_vs_aria2 -- --ignored --nocapture 2>&1 | tee -a perf.txt
      - name: Tableau dans le résumé
        if: always()
        run: grep -E '^(Machine|aria2|\||  [^ ])' perf.txt >> "$GITHUB_STEP_SUMMARY" || true
