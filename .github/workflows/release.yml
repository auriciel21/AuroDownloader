name: Publication

# Publication d'une version (SPEC 4.6, phase 7, étape 8c ; décisions du 2026-11-18) :
# l'utilisateur pousse une étiquette v0.x.y ; tout est construit, les installateurs Windows
# sont signés par SignPath quand ses secrets existent (facultatif), les mises à jour par la
# clé de l'utilisateur, l'APK par son magasin de clés ; un BROUILLON de publication est
# préparé, que l'utilisateur relit et publie. Procédure : docs/PUBLICATION.md.
#
# Audit W3, W4, W17 : chaque secret n'est donné qu'à l'étape qui signe ; actions épinglées
# par SHA (mises à jour par Dependabot, .github/dependabot.yml) ; aucun cache dans les
# constructions de publication ; aucun job ne garde le jeton de git.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Rien ne se construit si la version, la clé publique ou les secrets manquent.
  preflight:
    name: vérifications
    runs-on: ubuntu-latest
    env:
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version de l'étiquette partout
        run: sh scripts/version.sh --check "$GITHUB_REF_NAME"
      - name: Clé publique des mises à jour dans tauri.conf.json
        run: |
          if grep -q '"pubkey": ""' apps/desktop/tauri.conf.json; then
            echo "::error::clé publique des mises à jour absente de apps/desktop/tauri.conf.json (docs/PUBLICATION.md)"
            exit 1
          fi
      - name: Secrets
        run: |
          [ "$HAS_UPDATER_KEY" = true ] || { echo "::error::secret TAURI_SIGNING_PRIVATE_KEY absent"; exit 1; }
          [ "$HAS_KEYSTORE" = true ] || { echo "::error::secret ANDROID_KEYSTORE_BASE64 absent"; exit 1; }
          if [ "$HAS_SIGNPATH" = true ]; then echo "Signature Windows : SignPath"; \
          else echo "::warning::sans SignPath : installateurs Windows non signés (SmartScreen avertira)"; fi

  windows:
    name: Windows ${{ matrix.arch }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { runner: windows-latest, arch: x64 }
          - { runner: windows-11-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # branche stable
      # Version exacte (audit W4) : celle avec laquelle les paquets ont été essayés.
      - run: cargo install tauri-cli --version "=2.12.4" --locked
      - name: Installateur NSIS
        shell: pwsh
        run: apps/desktop/bundle.ps1
      - name: Installateur trouvé
        id: setup
        shell: pwsh
        run: |
          $files = @(Get-ChildItem apps/desktop/target/release/bundle/nsis/*_${{ matrix.arch }}-setup.exe)
          if ($files.Count -ne 1) { throw "installateur introuvable ou en double : $($files.Name)" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $files[0].FullName dist/
          "name=$($files[0].Name)" >> $env:GITHUB_OUTPUT
      # Signature Authenticode (facultative) : SignPath signe l'installateur. Le jeton ne
      # sert qu'à l'étape de SignPath, jamais à la construction (audit W3).
      - name: SignPath configuré ?
        id: signpath
        shell: bash
        env:
          HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        run: echo "enabled=$HAS_SIGNPATH" >> "$GITHUB_OUTPUT"
      - name: Installateur à signer
        id: unsigned
        if: steps.signpath.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-windows-${{ matrix.arch }}
          path: dist/${{ steps.setup.outputs.name }}
      - name: Signature SignPath
        if: steps.signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e # v1.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Installateur signé à la place
        if: steps.signpath.outputs.enabled == 'true'
        shell: pwsh
        run: |
          Copy-Item "signed/${{ steps.setup.outputs.name }}" "dist/${{ steps.setup.outputs.name }}" -Force
          $sig = Get-AuthenticodeSignature "dist/${{ steps.setup.outputs.name }}"
          if ($sig.Status -ne 'Valid') { throw "signature Authenticode : $($sig.Status)" }
      # Signature de la mise à jour, APRÈS Authenticode : elle porte sur le fichier publié.
      - name: Signature de la mise à jour
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cargo tauri signer sign "dist/${{ steps.setup.outputs.name }}"
          if ($LASTEXITCODE -ne 0) { throw "signature de la mise à jour : échec" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-${{ matrix.arch }}
          path: dist/

  linux:
    name: Linux ${{ matrix.arch }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # Ubuntu 22.04 : la plus ancienne glibc qui a WebKitGTK 4.1, pour que l'AppImage
          # tourne sur le plus de systèmes.
          - { runner: ubuntu-22.04, arch: amd64, appimage: amd64 }
          - { runner: ubuntu-22.04-arm, arch: arm64, appimage: aarch64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bibliothèques de Tauri (WebKitGTK 4.1) et outils de l'AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev pkg-config build-essential file libfuse2
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # branche stable
      # Version exacte (audit W4) : celle avec laquelle les paquets ont été essayés.
      - run: cargo install tauri-cli --version "=2.12.4" --locked
      - name: Paquets .deb et AppImage
        run: sh apps/desktop/bundle.sh
      - name: Paquets trouvés
        run: |
          set -eu
          mkdir -p dist
          cp apps/desktop/target/release/bundle/deb/*_${{ matrix.arch }}.deb dist/
          cp apps/desktop/target/release/bundle/appimage/*_${{ matrix.appimage }}.AppImage dist/
          ls -la dist
      - name: Signature de la mise à jour (AppImage)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri signer sign dist/*_${{ matrix.appimage }}.AppImage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-${{ matrix.arch }}
          path: dist/

  android:
    name: Android
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # branche stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - name: NDK du projet
        run: echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
      # Construit sans clé (sans AURO_KEYSTORE, Gradle ne signe pas), puis signé par
      # apksigner dans une étape à part : ni la clé ni ses mots de passe ne restent pendant
      # la construction (audit W3).
      - name: APK de publication, non signé
        working-directory: apps/android
        run: ./gradlew assembleRelease -PauroAbis=arm64-v8a
      - name: Signature par la clé de l'utilisateur
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          AURO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AURO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AURO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          umask 077
          version=${GITHUB_REF_NAME#v}
          set -- apps/android/app/build/outputs/apk/release/*.apk
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "::error::APK non signé introuvable ou en double : $*"; exit 1; }
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/auro.jks"
          "$tools/zipalign" -f -p 4 "$1" "$RUNNER_TEMP/aligned.apk"
          mkdir -p dist
          apk="dist/AuroDownloader_${version}_arm64.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/auro.jks" --ks-pass env:AURO_KEYSTORE_PASSWORD \
            --ks-key-alias "$AURO_KEY_ALIAS" --key-pass env:AURO_KEY_PASSWORD \
            --out "$apk" "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/auro.jks" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --print-certs "$apk"
      - name: Magasin de clés effacé
        if: always()
        run: rm -f "$RUNNER_TEMP/auro.jks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android
          path: dist/

  # Brouillon de publication : paquets, signatures, latest.json, SHA256SUMS. Les notes sont
  # le message de l'étiquette annotée (git tag -a).
  draft:
    name: brouillon de publication
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Lu par l'API, le jeton seulement à cette étape : le dépôt cloné ne le garde pas
      # (audit W17).
      - name: Message de l'étiquette
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")
          if [ "$(echo "$ref" | jq -r .object.type)" = tag ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$(echo "$ref" | jq -r .object.sha)" --jq .message > notes.md
          else
            : > notes.md
          fi
          [ -s notes.md ] || echo "AuroDownloader ${GITHUB_REF_NAME#v}." > notes.md
          cat notes.md
      # Installateurs signés seulement (pas les « unsigned-… » envoyés à SignPath).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
          pattern: windows-*
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
          pattern: linux-*
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          name: android
      - name: latest.json et SHA256SUMS
        run: |
          set -eu
          node scripts/latest-json.mjs "$GITHUB_REF_NAME" dist notes.md > dist/latest.json
          cat dist/latest.json
          (cd dist && sha256sum $(ls | grep -v -e '\.sig$' -e '^SHA256SUMS$') > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Brouillon
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "AuroDownloader ${GITHUB_REF_NAME#v}" --notes-file notes.md dist/*
