[package]
name = "auro-cli"
description = "Ligne de commande d'AuroDownloader"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "auro_cli"
path = "src/lib.rs"

[[bin]]
name = "auro"
path = "src/main.rs"

# Relais de l'extension navigateur (SPEC §4.5), lancé par le navigateur.
[[bin]]
name = "auro-relay"
path = "src/bin/relay.rs"

[dependencies]
anyhow = "1.0.104"
auro-engine = { path = "../engine" }
# Fichier .torrent envoyé au moteur (`auro add fichier.torrent`, SPEC §6.5).
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive"] }
# Mot de passe des identifiants de sites, saisi sans écho (`auro login set`).
rpassword = "7.4.0"
rusqlite = "0.40.2"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["io-std", "io-util", "macros", "rt", "signal", "time"] }

[dev-dependencies]
auro-engine = { path = "../engine", features = ["testing"] }
tempfile = "3.27.0"

# Temps processeur des outils comparés par le banc de performance.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.190"
