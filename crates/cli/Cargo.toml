[package]
name = "auro-cli"
description = "Ligne de commande d'AuroDownloader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "auro"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
auro-engine = { path = "../engine" }
clap = { version = "4.6.7", features = ["derive"] }
rusqlite = "0.40.2"
tokio = { version = "1.53.3", features = ["rt", "signal"] }

[dev-dependencies]
auro-engine = { path = "../engine", features = ["testing"] }
tempfile = "3.27.0"
