[package]
name = "auro-cli"
description = "Ligne de commande d'AuroDownloader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "auro"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
auro-engine = { path = "../engine" }
clap = { version = "4.6.7", features = ["derive"] }
