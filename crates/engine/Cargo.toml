[package]
name = "auro-engine"
description = "Moteur de téléchargement d'AuroDownloader (SPEC §4)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Serveur HTTP et HTTPS de test (module `testing`), pour les tests des autres paquets.
testing = ["dep:rcgen", "rustls/aws_lc_rs"]

[dependencies]
bytes = "1.12.1"
httpdate = "1.0.3"
percent-encoding = "2.3.2"
# Seulement pour la fonctionnalité `testing` : autorité de certification du serveur HTTPS.
rcgen = { version = "0.14.7", optional = true, default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
# Seulement pour reconnaître un certificat refusé dans la chaîne d'erreurs de reqwest.
rustls = { version = "0.23.46", default-features = false, features = ["std"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Protocole JSON-RPC (module `rpc`).
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
uuid = { version = "1.26.1", features = ["v7"] }

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
rcgen = { version = "0.14.7", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
rustls = { version = "0.23.46", features = ["aws_lc_rs"] }
tempfile = "3.27.0"
# Temps simulé pour les tests des seaux de jetons (`limit`).
tokio = { version = "1.53.3", features = ["macros", "rt", "test-util", "time"] }

# Canal nommé du protocole réservé à l'utilisateur courant (`rpc::local`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    # Espace libre d'un volume (`io::free_space`).
    "Win32_Storage_FileSystem",
    # Lancer `aurod` sans lui transmettre les poignées d'entrée et de sortie (`launch`).
    "Win32_System_Console",
    # Mise en veille, action de fin d'une planification (`power`).
    "Win32_System_Power",
    "Win32_System_Threading",
] }

# Espace libre d'un volume (`io::free_space`).
[target.'cfg(unix)'.dependencies]
libc = "0.2.190"
