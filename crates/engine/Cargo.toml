[package]
name = "auro-engine"
description = "Moteur de téléchargement d'AuroDownloader (SPEC §4)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Serveur HTTP et HTTPS de test (module `testing`), pour les tests des autres paquets.
testing = ["dep:wat"]

[dependencies]
# Erreurs des traits de librqbit (stockage du module `torrent`).
anyhow = "1.0.100"
# Authentification Basic (F-06, module `net::auth`).
base64 = "0.22.1"
bytes = "1.12.1"
# Dossier « Téléchargements » du système, dossier par défaut des ajouts.
dirs = "7.0.0"
httpdate = "1.0.3"
# Interface distante (F-39, SPEC §7.19, module `remote`) : serveur HTTP/1.1 et WebSocket ;
# hyper, hyper-util et http-body-util déjà tirés par reqwest ; tokio-tungstenite sans
# client ni TLS (la poignée de main est faite ici, sur une connexion de hyper).
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
# Torrent (SPEC §7.16, module `torrent`, décision du 2026-11-09) : sans ses fonctions par
# défaut, qui passent par OpenSSL ; `rust-tls` : rustls et ring/aws-lc, comme le moteur.
librqbit = { version = "=9.1.0", default-features = false, features = ["rust-tls"] }
# Interfaces réseau du système (liaison des torrents, SPEC §7.16) ; déjà tirée par librqbit.
network-interface = "2"
# Authentification Digest (RFC 7616, module `net::auth`) : MD5 et SHA-256.
md-5 = "0.10.6"
percent-encoding = "2.3.2"
# Fichiers Metalink (F-27) ; déjà présent par librqbit-upnp (MIT).
quick-xml = "0.41.0"
# Certificat auto-signé de l'interface distante (SPEC §7.19, étape 3b), et autorité de
# certification du serveur HTTPS de test (fonctionnalité `testing`).
rcgen = { version = "0.14.7", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "socks", "system-proxy"] }
# Certificat refusé dans la chaîne d'erreurs de reqwest ; serveur TLS de l'interface
# distante (aws-lc, comme le reste du moteur).
rustls = { version = "0.23.46", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Protocole JSON-RPC (module `rpc`).
serde_json = "1.0.154"
# Empreinte du fichier complet (F-11, `io::checksum`) : SHA-1 ; SHA-256 et MD5 servent
# aussi à Digest.
sha1 = "0.10.6"
sha2 = "0.10.9"
thiserror = "2.0.21"
# Dates du certificat fabriqué (type de rcgen) ; déjà tirée par rcgen.
time = { version = "0.3.45", default-features = false }
tokio = { version = "1.53.3", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
# Archive de ffmpeg sous Windows (builds BtbN, SPEC §7.17, `media::tools`) ; archive du
# diagnostic (N-12, `logs::write_archive`).
zip = { version = "7.3.0", default-features = false, features = ["deflate-flate2"] }
# Journaux (N-12, phase 7) : événements en lignes JSON, fichiers tournants (`logs`).
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "std", "registry"] }
# TLS de l'interface distante sur une connexion tokio ; déjà tirée par reqwest.
tokio-rustls = { version = "0.26.6", default-features = false, features = ["tls12"] }
# Fin de validité et noms d'un certificat (interface distante, SPEC §7.19).
x509-parser = "0.18.1"
uuid = { version = "1.26.1", features = ["v4", "v7"] }
# Plugins d'hébergeurs (F-41, SPEC §7.20) : interpréteur WebAssembly (prototype de l'étape
# 4a, `experiments/plugins`) ; sans `wat` ni `memory64`.
wasmi = { version = "2.0.0", default-features = false, features = ["std", "validate", "auto-dispatch"] }
# Plugins d'essai écrits en texte WebAssembly (`testing::plugin_files`, fonctionnalité
# `testing` et tests).
wat = { version = "1", optional = true }
# Signature des publications de yt-dlp (SPEC §7.17, `media::openpgp`) : RSA PKCS #1 ;
# déjà tirée par librqbit et rustls.
aws-lc-rs = "1.18"

[dev-dependencies]
wat = "1"
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
rcgen = { version = "0.14.7", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
rustls = { version = "0.23.46", features = ["aws_lc_rs"] }
tempfile = "3.27.0"
# Contrat du protocole (SPEC §9.1, phase 7) : réponses et notifications validées contre les
# schémas de `docs/protocol`. Sans résolution par le réseau.
jsonschema = { version = "0.61.2", default-features = false }
# Temps simulé pour les tests des seaux de jetons (`limit`).
tokio = { version = "1.53.3", features = ["macros", "rt", "test-util", "time"] }

# Canal nommé du protocole réservé à l'utilisateur courant (`rpc::local`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    # Coffre du système : Gestionnaire d'identification (`secrets`).
    "Win32_Security_Credentials",
    # Espace libre d'un volume (`io::free_space`).
    "Win32_Storage_FileSystem",
    # Arbre des processus de la vidéo, tué avec son Job Object (`media::process`).
    "Win32_System_JobObjects",
    # Lancer `aurod` sans lui transmettre les poignées d'entrée et de sortie (`launch`).
    "Win32_System_Console",
    # Mise en veille, action de fin d'une planification (`power`).
    "Win32_System_Power",
    # Nom DNS de la machine, porté par le certificat de l'interface distante.
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

# Coffre du système sous Linux : Secret Service par D-Bus (`secrets`).
[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5.1.0", features = ["rt-async-io-crypto-rust"] }
# Archive de ffmpeg sous Linux, quand le système n'en a pas (`.tar.xz` de BtbN,
# `media::tools`).
tar ="0.4.46"
xz2 = "0.1.7"

# Espace libre d'un volume (`io::free_space`).
[target.'cfg(unix)'.dependencies]
libc = "0.2.190"
