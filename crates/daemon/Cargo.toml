[package]
name = "auro-daemon"
description = "Moteur d'AuroDownloader en processus autonome, piloté par le protocole JSON-RPC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "aurod"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
auro-engine = { path = "../engine" }
clap = { version = "4.6.7", features = ["derive"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "signal"] }

[dev-dependencies]
auro-engine = { path = "../engine", features = ["testing"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
