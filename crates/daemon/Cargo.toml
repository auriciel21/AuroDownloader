[package]
name = "auro-daemon"
description = "Moteur d'AuroDownloader en processus autonome, piloté par le protocole JSON-RPC"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "aurod"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
auro-engine = { path = "../engine" }
clap = { version = "4.6.7", features = ["derive"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "signal"] }
# Événements du journal (N-12), installé par `auro_engine::logs`.
tracing = "0.1.44"

[dev-dependencies]
# Banc des torrents : le fichier .torrent passe en base64 (`task.add`).
base64 = "0.22.1"
auro-engine = { path = "../engine", features = ["testing"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
